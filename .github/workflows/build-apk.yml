name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "app.py"
      - "core/**"
      - "ui/**"
      - "assets/**"
      - "pyproject.toml"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[cli]==1.1.2"
          flet --version --json

      - name: Build APK
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: |
          flet build apk --yes --verbose --build-number "${{ github.run_number }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minedeck-apk-${{ github.run_number }}
          path: build/apk/*.apk
          if-no-files-found: error
